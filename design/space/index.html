<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c2f55">
<title>Chord Space</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
  :root { --ink: #f6f1e7; --soft: rgba(246,241,231,.7); --faint: rgba(246,241,231,.38); --hair: rgba(246,241,231,.14); --glass: rgba(246,241,231,.08); }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { background: radial-gradient(120% 80% at 50% 40%, #3d4170 0%, #2c2f55 55%, #22244a 100%); color: var(--ink); font: 400 15px/1.4 Archivo, system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  #gl { position: fixed; inset: 0; }
  .top { position: fixed; left: 0; right: 0; top: 0; padding: calc(12px + env(safe-area-inset-top)) 20px 0; pointer-events: none; }
  .ttl { font-size: 13px; font-weight: 650; color: var(--soft); } .ttl b { color: var(--ink); }
  .ch { margin-top: 6px; font: 800 64px/0.86 Archivo; font-stretch: 62%; letter-spacing: -0.02em; }
  .ch small { font-size: .3em; font-stretch: 100%; font-weight: 650; letter-spacing: 0; margin-left: 8px; padding: 3px 9px; border-radius: 999px; color: #26283f; vertical-align: .9em; }
  .near { margin-top: 10px; font-size: 15px; color: var(--soft); max-width: 25em; } .near b { color: var(--ink); }
  .bottom { position: fixed; left: 0; right: 0; bottom: 0; padding: 30px 20px calc(14px + env(safe-area-inset-bottom)); background: linear-gradient(to top, rgba(34,36,74,.95) 60%, rgba(34,36,74,0)); }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .chip { flex: none; height: 30px; padding: 0 12px; border-radius: 999px; font-size: 12.5px; font-weight: 650; color: var(--soft); background: var(--glass); box-shadow: inset 0 0 0 1px var(--hair); display: inline-flex; align-items: center; gap: 6px; }
  .chip i { width: 8px; height: 8px; border-radius: 50%; }
  .chip.off { opacity: .45; }
  .row { display: flex; align-items: center; gap: 14px; margin-top: 12px; }
  .play { width: 58px; height: 58px; border-radius: 50%; background: var(--ink); color: #2c2f55; display: grid; place-items: center; flex: none; box-shadow: 0 8px 26px rgba(10,10,30,.45); }
  .play svg { width: 22px; height: 22px; }
  .row .t { flex: 1; font-size: 13px; color: var(--soft); } .row .t b { display: block; color: var(--ink); font-size: 14.5px; }
  .hint { font-size: 12px; color: var(--faint); margin-top: 8px; }
</style>
</head>
<body>
<div id="gl"></div>
<header class="top"><div class="ttl"><b>Prelude in C</b> · Bach · chords as places in 3D</div><div class="ch" id="ch"></div><p class="near" id="near"></p></header>
<section class="bottom">
  <div class="chips" id="chips"></div>
  <div class="row"><button class="play" id="pp" aria-label="Play"></button><div class="t" id="t"></div></div>
  <p class="hint">Drag to turn the space · pinch to zoom · tap a chord to hear it</p>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script type="module" src="space.js?v=2"></script>
</body>
</html>
