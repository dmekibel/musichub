<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0a20">
<title>Harmony Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0c0a20; --ink: #f6f0e4; --soft: rgba(246,240,228,.62); --faint: rgba(246,240,228,.32); --hair: rgba(246,240,228,.12); --glass: rgba(246,240,228,.055); }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 400 15px/1.4 Archivo, system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; overscroll-behavior: none; }
  a { color: inherit; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
  .top { position: fixed; left: 0; right: 0; top: 0; z-index: 2; padding: calc(12px + env(safe-area-inset-top)) 18px 0; pointer-events: none; }
  .top > * { pointer-events: auto; }
  .brand { display: flex; align-items: flex-end; justify-content: space-between; }
  h1 { font: 800 54px/0.85 Archivo; font-stretch: 62%; letter-spacing: -0.025em; }
  .sub { margin-top: 8px; font-size: 14.5px; color: var(--soft); max-width: 30em; }
  .seg { position: relative; display: inline-grid; grid-template-columns: repeat(3, 1fr); margin-top: 14px; padding: 3px; border-radius: 999px; background: var(--glass); box-shadow: inset 0 0 0 1px var(--hair); }
  .seg button { position: relative; z-index: 1; height: 32px; padding: 0 16px; font-size: 13.5px; font-weight: 650; color: var(--soft); transition: color .3s; }
  .seg button.on { color: #17132f; }
  .seg i { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / 3); border-radius: 999px; background: var(--ink); transition: transform .45s cubic-bezier(.3,.9,.2,1); }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; padding: 30px 18px calc(16px + env(safe-area-inset-bottom)); background: linear-gradient(to top, rgba(12,10,32,.95) 62%, rgba(12,10,32,0)); }
  .sl label { display: flex; justify-content: space-between; align-items: baseline; font-size: 12.5px; font-weight: 650; color: var(--soft); }
  .sl label b { color: var(--ink); }
  .ticks { display: grid; grid-template-columns: repeat(5, 1fr); font-size: 11px; color: var(--faint); font-weight: 600; margin-top: -2px; }
  .ticks span:nth-child(n+2) { text-align: center; } .ticks span:last-child { text-align: right; }
  .ticks span.on { color: var(--ink); }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 30px; background: transparent; }
  input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: linear-gradient(to right, var(--ink) var(--p, 50%), var(--hair) var(--p, 50%)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; margin-top: -10.5px; border-radius: 50%; background: var(--ink); box-shadow: 0 2px 10px rgba(0,0,0,.4); }
  .song { display: flex; align-items: center; gap: 14px; margin-top: 14px; padding: 10px 10px 10px 14px; border-radius: 18px; background: var(--glass); box-shadow: inset 0 0 0 1px var(--hair); }
  .song .txt { flex: 1; min-width: 0; } .song b { display: block; font-weight: 700; font-size: 15px; } .song span { display: block; font-size: 13px; color: var(--soft); }
  .play { width: 52px; height: 52px; border-radius: 50%; background: var(--ink); color: #17132f; display: grid; place-items: center; flex: none; box-shadow: 0 6px 22px rgba(0,0,0,.4); transition: transform .15s; }
  .play:active { transform: scale(.94); } .play svg { width: 20px; height: 20px; }
  .card { margin-bottom: 12px; padding: 16px; border-radius: 18px; background: rgba(28,24,62,.86); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: inset 0 0 0 1px var(--hair), 0 20px 50px rgba(0,0,0,.4); display: none; }
  .card.show { display: block; animation: up .35s cubic-bezier(.3,.9,.2,1); }
  @keyframes up { from { transform: translateY(14px); opacity: 0; } }
  .card .kind { font-size: 12.5px; font-weight: 650; color: var(--soft); }
  .card h2 { font: 800 48px/0.86 Archivo; font-stretch: 62%; letter-spacing: -0.02em; margin-top: 4px; }
  .card p { margin-top: 8px; font-size: 15px; color: var(--soft); } .card p b { color: var(--ink); }
  .card .acts { display: flex; gap: 10px; margin-top: 12px; }
  .pillbtn { height: 40px; padding: 0 16px; border-radius: 999px; background: var(--ink); color: #17132f; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
  .pillbtn.ghost { background: var(--glass); color: var(--ink); }
  .pillbtn svg { width: 14px; height: 14px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<header class="top">
  <div class="brand"><h1>The Harmony Map</h1></div>
  <p class="sub" id="sub">Every chord has a place. Tap one, or play a piece and watch its route.</p>
  <nav class="seg" id="seg"><i></i><button data-v="keys" class="on">Keys</button><button data-v="families">Families</button><button data-v="clock">Clock</button></nav>
</header>
<section class="sheet">
  <div class="card" id="card"></div>
  <div class="sl"><label>Detail <b id="lvl"></b></label><input type="range" id="level" min="1" max="5" step="1" value="3"><div class="ticks" id="ticks"><span>Keys</span><span>Minor</span><span>Tension</span><span>Squares</span><span>Links</span></div></div>
  <div class="song"><div class="txt"><b>Prelude in C · Bach</b><span id="songsub">Watch its route across the map</span></div><button class="play" id="pp" aria-label="Play"></button></div>
</section>
<script type="module" src="map.js?v=1"></script>
</body>
</html>
