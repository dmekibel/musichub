<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0a20">
<title>MusicHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0c0a20; --card: rgba(246,240,228,.045); --ink: #f6f0e4; --soft: rgba(246,240,228,.64); --faint: rgba(246,240,228,.34); --hair: rgba(246,240,228,.1);
          --home: #ffc04a; --away: #2fd4a4; --tension: #8a7cff; }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--ink); font: 400 16px/1.45 Archivo, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  svg { display: block; }
  .screen { max-width: 520px; margin: 0 auto; padding: calc(14px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom)); }
  .disp { font-weight: 800; font-stretch: 62%; letter-spacing: -0.025em; line-height: .86; }
  .kicker { font-size: 13px; font-weight: 650; color: var(--soft); }
  .soft { color: var(--soft); }

  /* ---------- the wall of moves */
  .wall-h { display: flex; justify-content: space-between; align-items: flex-end; padding-top: 12px; }
  .wall-h h1 { font-size: 64px; }
  .me { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 15px; background: var(--card); box-shadow: inset 0 0 0 1px var(--hair); margin-bottom: 6px; }
  .lede { margin-top: 10px; font-size: 17px; color: var(--soft); max-width: 24em; }
  .today { display: block; margin-top: 22px; padding: 18px 18px 14px; border-radius: 22px; background: linear-gradient(160deg, rgba(138,124,255,.16), rgba(255,192,74,.06)); box-shadow: inset 0 0 0 1px var(--hair); }
  .today .row1 { display: flex; justify-content: space-between; align-items: baseline; }
  .today h2 { font-size: 44px; margin-top: 6px; }
  .today .mini { margin-top: 12px; }
  .today .go { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 14px; color: var(--soft); }
  .playchip { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px 0 12px; border-radius: 999px; background: var(--ink); color: #17132f; font-weight: 700; font-size: 14.5px; }
  .playchip svg { width: 16px; height: 16px; }
  .group { margin-top: 34px; }
  .group-h { display: flex; justify-content: space-between; align-items: baseline; }
  .group-h h3 { font-size: 30px; }
  .group-h span { font-size: 13px; color: var(--soft); }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .tile { display: flex; flex-direction: column; justify-content: space-between; min-height: 156px; padding: 14px; border-radius: 18px; background: var(--card); box-shadow: inset 0 0 0 1px var(--hair); transition: transform .15s; }
  .tile:active { transform: scale(.98); }
  .tile .nm { font-size: 27px; margin-top: 10px; }
  .tile .in { font-size: 12.5px; color: var(--soft); margin-top: 6px; line-height: 1.3; }
  .tile.here { box-shadow: inset 0 0 0 1px rgba(255,192,74,.45); }
  .tile .badge { display: inline-block; font-size: 11px; font-weight: 700; color: var(--home); letter-spacing: .02em; }
  .illus { margin-top: 30px; font-size: 12px; color: var(--faint); text-align: center; }

  /* ---------- the Journey player */
  .bar { display: flex; align-items: center; justify-content: space-between; height: 44px; margin: 0 -8px; }
  .bar a, .bar .r { width: 44px; height: 44px; display: grid; place-items: center; }
  .bar svg { width: 22px; height: 22px; }
  .bar .t { text-align: center; font-size: 14px; font-weight: 650; } .bar .t span { display: block; font-size: 12px; font-weight: 500; color: var(--soft); }
  .state { margin-top: 18px; min-height: 128px; }
  .state .big { font-size: 96px; display: flex; align-items: flex-start; transition: color .5s; }
  .state .big sup { font-size: .36em; margin: .06em 0 0 .04em; letter-spacing: 0; }
  .state .big .over { font-size: .24em; font-stretch: 100%; font-weight: 600; letter-spacing: 0; color: var(--soft); align-self: flex-end; margin: 0 0 .5em 10px; }
  .state p { margin-top: 10px; font-size: 18px; color: var(--soft); } .state p b { color: var(--ink); }
  .jw { position: relative; margin: 18px -20px 0; }
  .jw svg { width: 100%; height: auto; }
  .jw .tap { position: absolute; inset: 0; cursor: pointer; }
  .mvl { font: 700 11.5px Archivo; fill: var(--soft); }
  .mvl.on { fill: var(--ink); }
  .axis { font: 600 11px Archivo; fill: var(--faint); }
  .move { margin-top: 18px; padding: 16px; border-radius: 18px; background: var(--card); box-shadow: inset 0 0 0 1px var(--hair); }
  .move .k { font-size: 12.5px; font-weight: 650; color: var(--soft); }
  .move h3 { font-size: 34px; margin-top: 4px; }
  .move p { margin-top: 6px; font-size: 15.5px; color: var(--soft); }
  .move .chords { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .move .chords span { font-size: 13.5px; font-weight: 700; padding: 4px 9px; border-radius: 8px; background: rgba(246,240,228,.07); }
  .move .chords span.on { background: var(--ink); color: #17132f; }
  .move .chords small { display: block; font-size: 11px; font-weight: 600; color: var(--soft); }
  .move .chords span.on small { color: rgba(23,19,47,.7); }
  .move .more { display: flex; justify-content: space-between; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--hair); font-size: 14px; font-weight: 650; }
  .move .more span { color: var(--soft); font-weight: 500; }
  .depth { margin-top: 20px; }
  .depth .lab { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 650; color: var(--soft); }
  .stops { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 10px; height: 40px; border-radius: 999px; background: var(--card); box-shadow: inset 0 0 0 1px var(--hair); }
  .stops button { position: relative; z-index: 1; font-size: 14px; font-weight: 650; color: var(--soft); transition: color .3s; }
  .stops button.on { color: #17132f; }
  .stops i { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / 4); border-radius: 999px; background: var(--ink); transition: transform .45s cubic-bezier(.3,.9,.2,1); }
  .transport { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-top: 22px; }
  .transport .t { font-size: 13px; font-weight: 650; color: var(--soft); font-variant-numeric: tabular-nums; }
  .transport .t.r { text-align: right; }
  .play { width: 68px; height: 68px; border-radius: 50%; background: var(--ink); color: #17132f; display: grid; place-items: center; box-shadow: 0 8px 30px rgba(0,0,0,.45); transition: transform .15s; }
  .play:active { transform: scale(.94); } .play svg { width: 24px; height: 24px; }
  .why { margin-top: 10px; font-size: 13px; color: var(--soft); }
  .why a { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--faint); color: var(--ink); }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="journey.js?v=2"></script>
</body>
</html>
