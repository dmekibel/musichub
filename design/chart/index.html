<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3a3e68">
<title>Music Chart</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
  :root { --bg: #3a3e68; --pane: #33375d; --ink: #f6f1e7; --soft: rgba(246,241,231,.7); --faint: rgba(246,241,231,.38); --hair: rgba(246,241,231,.14); --glass: rgba(246,241,231,.08);
          --home: #f2c14e; --away: #3aa6a0; --tension: #e2546b; }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--ink); font: 400 15px/1.4 Archivo, system-ui, sans-serif; -webkit-font-smoothing: antialiased; padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  svg { display: block; overflow: visible; }
  header { padding: calc(12px + env(safe-area-inset-top)) 16px 0; }
  .ticker { display: flex; justify-content: space-between; align-items: baseline; }
  .ticker .nm { font-size: 13px; font-weight: 650; color: var(--soft); } .ticker .nm b { color: var(--ink); }
  .ticker .bar { font-size: 13px; font-weight: 650; color: var(--soft); font-variant-numeric: tabular-nums; }
  .read { display: flex; align-items: flex-end; gap: 12px; margin-top: 6px; }
  .read .ch { font: 800 52px/0.86 Archivo; font-stretch: 62%; letter-spacing: -0.02em; }
  .read .ch sup { font-size: .42em; vertical-align: .9em; letter-spacing: 0; }
  .read .meta { padding-bottom: 4px; font-size: 13.5px; color: var(--soft); line-height: 1.35; } .read .meta b { color: var(--ink); }
  .fnp { display: inline-block; font-size: 12px; font-weight: 750; padding: 2px 8px; border-radius: 999px; color: #26283f; margin-right: 6px; }
  .tf { display: flex; gap: 4px; margin-top: 12px; }
  .tf button { height: 30px; padding: 0 12px; border-radius: 8px; font-size: 13px; font-weight: 700; color: var(--soft); }
  .tf button.on { background: var(--glass); color: var(--ink); box-shadow: inset 0 0 0 1px var(--hair); }
  .tf .sp { flex: 1; }
  .chart { position: relative; margin-top: 8px; }
  .pane { position: relative; background: var(--pane); border-top: 1px solid var(--hair); }
  .pane.main { background: transparent; border-top: 0; }
  .pane .pl { position: absolute; left: 16px; top: 6px; font-size: 11.5px; font-weight: 700; color: var(--soft); pointer-events: none; z-index: 1; }
  .pane .pl span { color: var(--faint); font-weight: 600; margin-left: 4px; }
  .pane .pv { position: absolute; right: 16px; top: 6px; font-size: 11.5px; font-weight: 750; color: var(--ink); pointer-events: none; font-variant-numeric: tabular-nums; z-index: 1; }
  .vline { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px dashed rgba(246,241,231,.6); pointer-events: none; z-index: 3; display: none; }
  .phead { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1.5px solid var(--ink); pointer-events: none; z-index: 2; opacity: .85; }
  .touch { position: absolute; inset: 0; z-index: 4; touch-action: pan-y; cursor: crosshair; }
  .overlays, .adds { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 10px 16px 0; }
  .overlays::-webkit-scrollbar, .adds::-webkit-scrollbar { display: none; }
  .chip { flex: none; height: 30px; padding: 0 12px; border-radius: 999px; font-size: 12.5px; font-weight: 650; color: var(--soft); background: var(--glass); box-shadow: inset 0 0 0 1px var(--hair); display: inline-flex; align-items: center; gap: 6px; }
  .chip.on { color: var(--ink); box-shadow: inset 0 0 0 1.5px rgba(246,241,231,.6); }
  .chip.on::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink); }
  .lab { font-size: 11px; font-weight: 650; color: var(--faint); padding: 14px 16px 0; letter-spacing: .02em; }
  .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 70%, rgba(58,62,104,0)); display: flex; align-items: center; gap: 14px; }
  .play { width: 56px; height: 56px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; flex: none; box-shadow: 0 8px 26px rgba(20,20,40,.45); }
  .play svg { width: 22px; height: 22px; }
  .dock .t { flex: 1; font-size: 13px; color: var(--soft); } .dock .t b { color: var(--ink); display: block; font-size: 14.5px; }
  text { font-family: Archivo; }
</style>
</head>
<body>
<header>
  <div class="ticker"><span class="nm"><b>Prelude in C</b> · Bach · BWV 846</span><span class="bar" id="rb"></span></div>
  <div class="read"><div class="ch" id="rc"></div><div class="meta" id="rm"></div></div>
  <div class="tf" id="tf"><button data-g="1" class="on">Bar</button><button data-g="4">Phrase</button><button data-g="s">Section</button><span class="sp"></span></div>
</header>
<div class="chart" id="chart"></div>
<div class="lab">ON THE MAIN CHART</div>
<div class="overlays" id="ov"></div>
<div class="lab">ANALYSIS PANES</div>
<div class="adds" id="ad"></div>
<div class="dock"><button class="play" id="pp" aria-label="Play"></button><div class="t" id="dt"></div></div>
<script type="module" src="chart.js?v=2"></script>
</body>
</html>
